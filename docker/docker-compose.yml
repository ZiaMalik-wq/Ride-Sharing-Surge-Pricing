services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: surge_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - surge_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: surge_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - surge_network

  redis:
    image: redis:7-alpine
    container_name: surge_redis
    ports:
      - "6379:6379"
    networks:
      - surge_network

  jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    container_name: surge_flink_jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ..:/opt/flink/project
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.bind-host: 0.0.0.0
    networks:
      - surge_network

  taskmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    container_name: surge_flink_taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    volumes:
      - ..:/opt/flink/project
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - surge_network

networks:
  surge_network:
    driver: bridge